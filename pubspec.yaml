name: sentino
description: "Sentino - IoT 智能设备管理应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.8.1
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  flutter_blue_plus: ^1.35.2
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  mobile_scanner: ^6.0.2
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.14
  test: ^1.25.8
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/icon/logo.png"
  web:
    generate: true
    image_path: "assets/icon/logo.png"
  image_path: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

